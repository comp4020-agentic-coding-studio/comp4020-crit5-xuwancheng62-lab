<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sole Survivor — a five-minute survival game</title>
    <meta
      name="description"
      content="A tiny top-down survival game: move to live, everything else happens on its own."
    />

    <!-- The link-preview card resolves against this page, like any link. No
         og:title/og:description: scrapers fall back to the title and
         description above. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>

    <main data-testid="game-root">
      <h1 class="visually-hidden">A survival game</h1>

      <canvas data-testid="game-canvas"></canvas>

      <div class="hud" data-testid="hud">
        <div class="health-icon" aria-hidden="true"></div>
        <div class="health-bar" data-testid="health-bar">
          <div class="health-fill" data-testid="health-fill"></div>
        </div>
        <div class="timer" data-testid="timer">90</div>
        <div class="level" data-testid="level">
          <div class="level-icon" aria-hidden="true"></div>
          <span data-testid="level-value">1</span>
        </div>
        <div class="loadout" data-testid="loadout">
          <div class="loadout-slot" data-testid="loadout-slot-0"></div>
          <div class="loadout-slot" data-testid="loadout-slot-1"></div>
          <div class="loadout-slot" data-testid="loadout-slot-2"></div>
        </div>
      </div>

      <div class="boss-health-bar" data-testid="boss-health-bar" hidden>
        <div class="boss-health-fill" data-testid="boss-health-fill"></div>
      </div>

      <div class="end-screen" data-testid="end-screen" hidden>
        <p data-testid="end-message"></p>
        <button type="button" class="restart-button" data-testid="restart-button">
          Play again
        </button>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
